version: "3"

vars:
  GODOT: /Applications/Godot.app/Contents/MacOS/Godot

tasks:
  run:
    desc: Launch the game (no editor), logging output to logs/run.log
    cmds:
      - mkdir -p logs
      - "{{.GODOT}} --path . > logs/run.log 2>&1"

  run-headless:
    desc: Launch the game headlessly (no window, no editor), logging output to logs/run-headless.log
    cmds:
      - mkdir -p logs
      - "{{.GODOT}} --path . --headless > logs/run-headless.log 2>&1"

  editor:
    desc: Open the project in the Godot editor
    cmds:
      - "{{.GODOT}} --path . -e"
