version: "3"

vars:
  # Override with GODOT_BIN=/path/to/godot for a different install.
  GODOT: '{{.GODOT_BIN | default "/Applications/Godot.app/Contents/MacOS/Godot"}}'
  EXPORT_MACOS_PRESET: macOS
  EXPORT_MACOS_ZIP: dist/ProtestSimulator-macOS.zip
  EXPORT_WINDOWS_PRESET: Windows Desktop
  EXPORT_WINDOWS_ZIP: dist/ProtestSimulator-Windows.zip

tasks:
  # Bare `task` lists what is available rather than failing with
  # "Task \"default\" does not exist".
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  run:
    desc: Launch the game (no editor), logging output to logs/run.log
    cmds:
      - mkdir -p logs
      - "{{.GODOT}} --path . > logs/run.log 2>&1"

  run-headless:
    desc: Launch the game headlessly (no window, no editor), logging output to logs/run-headless.log
    cmds:
      - mkdir -p logs
      - "{{.GODOT}} --path . --headless > logs/run-headless.log 2>&1"

  editor:
    desc: Open the project in the Godot editor
    cmds:
      - "{{.GODOT}} --path . -e"

  verify:singleplayer:
    desc: Headless smoke test of the single-player match bootstrap and replication wiring
    cmds:
      - mkdir -p logs
      - "{{.GODOT}} --path . --headless --script res://scripts/_debug_verify_multiplayer.gd"

  test:lan:
    desc: Two headless Godot processes (listen server + client) replicating over 127.0.0.1:7000
    cmds:
      - bash tools/lan_loopback_test.sh

  build:all:
    desc: Build both release ZIPs into dist/
    cmds:
      - task: export:macos
      - task: export:windows

  export:macos:
    desc: Build a Universal 2 macOS release ZIP into dist/
    aliases: [export:macos:zip]
    cmds:
      - mkdir -p dist
      - |
        set -euo pipefail
        echo "== exporting preset '{{.EXPORT_MACOS_PRESET}}' -> {{.EXPORT_MACOS_ZIP}}"
        rm -f "{{.EXPORT_MACOS_ZIP}}"
        "{{.GODOT}}" --headless --path . \
          --export-release "{{.EXPORT_MACOS_PRESET}}" "{{.EXPORT_MACOS_ZIP}}"
      - task: _export:macos:verify:zip

  export:windows:
    desc: Build a Windows x86_64 release ZIP into dist/
    cmds:
      - mkdir -p dist
      - |
        set -eu
        archive="{{.EXPORT_WINDOWS_ZIP}}"
        rm -f "$archive"
        "{{.GODOT}}" --headless --path . \
          --export-release "{{.EXPORT_WINDOWS_PRESET}}" "$archive"

        listing="$(unzip -Z1 "$archive")"
        if ! printf '%s\n' "$listing" | grep -Eq '(^|/)ProtestSimulator-Windows[.]exe$'; then
          echo "error: $archive is missing ProtestSimulator-Windows.exe." >&2
          exit 1
        fi
        echo "== OK: $archive contains ProtestSimulator-Windows.exe"

  _export:macos:verify:zip:
    internal: true
    silent: true
    desc: Fail loudly unless the exported ZIP contains a complete, playable .app
    cmds:
      - |
        set -euo pipefail
        ZIP="{{.EXPORT_MACOS_ZIP}}"
        if [ ! -f "$ZIP" ]; then
          echo "error: export produced no archive at $ZIP." >&2
          exit 1
        fi
        LISTING="$(unzip -Z1 "$ZIP")"
        for required in \
          "ProtestSimulator.app/Contents/MacOS/ProtestSimulator" \
          "ProtestSimulator.app/Contents/Info.plist" \
          "ProtestSimulator.app/Contents/Resources/ProtestSimulator.pck"
        do
          if ! printf '%s\n' "$LISTING" | grep -qx "$required"; then
            echo "error: $ZIP is missing $required -- the .app would not be playable." >&2
            echo "       Archive contents:" >&2
            printf '%s\n' "$LISTING" | head -40 >&2
            exit 1
          fi
        done
        echo "== OK: $ZIP contains a complete ProtestSimulator.app"
        echo "   $(du -h "$ZIP" | cut -f1) — distribute this file."
        echo "   Note: ad-hoc signed, so first launch needs a Gatekeeper override."
        echo "   See README.md > Running the exported application."
